# Um unico dominio (lotoanalytic.com.br) serve a landing na raiz e o SPA React
# nos caminhos dele. A landing eh o root; o SPA vive sob /spa-assets/ (bundle) e
# nas rotas de aplicacao listadas abaixo.
server {
    listen 80 default_server;
    server_name lotoanalytic.com.br www.lotoanalytic.com.br _;

    # Landing estatica no apex.
    root /usr/share/nginx/html/landing;
    index index.html;

    # TLS termina no Traefik (nginx recebe HTTP). Redirect relativo evita downgrade.
    absolute_redirect off;

    # ads.txt do AdSense vem do bundle do SPA (apps/web/public/ads.txt).
    location = /ads.txt {
        root /usr/share/nginx/html;
    }

    # Assets versionados do SPA (hash no nome) - cache agressivo.
    location ^~ /spa-assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rotas da aplicacao React: entregam sempre o index.html do SPA (client-side routing).
    location ~ ^/(dashboard|gerar-jogos|gerador|conferidor|historicos|perfil|modalidades|concursos|admin|adm|estatisticas|auth|privacidade)(/|$) {
        root /usr/share/nginx/html;
        # Prerender de SEO: rotas indexaveis tem um HTML estatico ($uri.html) gerado
        # no build (ver vite.config.ts). Tenta o arquivo pre-renderizado antes de cair
        # no index.html do SPA (arg intermediario direto, evitando o internal redirect
        # que cairia no "location = /index.html" da landing).
        try_files $uri $uri.html /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # index.html da landing nunca fica em cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Landing (raiz e demais arquivos estaticos: styles.css, app.js, assets/, icons/, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
