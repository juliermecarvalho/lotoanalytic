server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O index.html nunca pode ficar em cache: e ele que aponta para o bundle novo apos cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados de forma agressiva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
