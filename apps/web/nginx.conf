# Landing estatica servida no dominio apex (lotoanalytic.com.br).
server {
    listen 80;
    server_name lotoanalytic.com.br www.lotoanalytic.com.br;

    root /usr/share/nginx/html/landing;
    index index.html;

    # O index.html da landing nunca fica em cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Aplicativo React servido no subdominio app (e como fallback padrao para outros hosts/IP).
server {
    listen 80 default_server;
    server_name app.lotoanalytic.com.br _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS termina no Traefik (nginx recebe HTTP). Redirect relativo evita downgrade para http.
    absolute_redirect off;

    # A raiz do app nao tem tela propria: leva direto ao painel da Lotofacil.
    location = / {
        return 302 /dashboard/lotofacil;
    }

    # O index.html nunca pode ficar em cache: e ele que aponta para o bundle novo apos cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets com hash no nome podem ser cacheados de forma agressiva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
