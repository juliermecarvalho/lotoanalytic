services:
  postgres:
    image: postgres:17-alpine
    container_name: lotoanalytics-postgres
    environment:
      POSTGRES_DB: lotoanalytics
      POSTGRES_USER: lotoanalytics
      POSTGRES_PASSWORD: lotoanalytics_dev
    ports:
      - "5432:5432"
    volumes:
      - ./bd/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotoanalytics -d lotoanalytics"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-init:
    image: postgres:17-alpine
    container_name: lotoanalytics-postgres-init
    environment:
      PGPASSWORD: lotoanalytics_dev
    command:
      [
        "sh",
        "-c",
        "psql -h postgres -U lotoanalytics -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'lotoanalytics_keycloak'\" | grep -q 1 || psql -h postgres -U lotoanalytics -d postgres -c \"CREATE DATABASE lotoanalytics_keycloak OWNER lotoanalytics\""
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: lotoanalytics-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: lotoanalytics-keycloak
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: lotoanalytics_keycloak
      KC_DB_USERNAME: lotoanalytics
      KC_DB_PASSWORD: lotoanalytics_dev
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /realms/lotoanalytics HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q 'lotoanalytics'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lotoanalytics-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=lotoanalytics;Username=lotoanalytics;Password=lotoanalytics_dev
      Keycloak__Authority: http://localhost:8080/realms/lotoanalytics
      Keycloak__MetadataAddress: http://keycloak:8080/realms/lotoanalytics/.well-known/openid-configuration
      Keycloak__Audience: lotoanalytics-api
      Keycloak__RequireHttpsMetadata: "false"
      ContestUpdates__Enabled: "true"
      ContestUpdates__RunOnStartup: "true"
      ContestUpdates__DailyRunAt: "01:00:00"
      ContestUpdates__TimeZoneId: "America/Sao_Paulo"
      ContestUpdates__DelayMilliseconds: "200"
      ContestUpdates__ErrorDelayMilliseconds: "300000"
      ContestUpdates__MaxRetryAttempts: "3"
      Cors__AllowedOrigins__0: http://127.0.0.1:5174
      Cors__AllowedOrigins__1: http://localhost:5174
    ports:
      - "5291:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:5291
        VITE_KEYCLOAK_AUTHORITY: http://localhost:8080/realms/lotoanalytics
        VITE_KEYCLOAK_CLIENT_ID: lotoanalytics-web
    container_name: lotoanalytics-web
    ports:
      - "5174:80"
    depends_on:
      - api
